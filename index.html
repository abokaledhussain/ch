<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشغل القنوات المباشرة التفاعلي</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --bg-color: #f4f7fe;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger: #ef4444;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
      --radius: 16px;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    .container { max-width: 1280px; margin: 0 auto; padding: 20px 15px 60px; }

    header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; background: var(--card-bg); padding: 20px 25px; border-radius: var(--radius); box-shadow: var(--shadow);
    }
    header h1 { margin: 0; font-size: 22px; color: #0f172a; display: flex; align-items: center; gap: 10px; }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .player-wrapper { background: #000; border-radius: var(--radius); overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); margin-bottom: 30px; display: none; }
    .player-header { background: #1e293b; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .player-title { font-weight: bold; font-size: 16px; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    .controls-bar { margin-bottom: 30px; }
    .search-box { position: relative; }
    .search-input { width: 100%; padding: 12px 20px; padding-right: 45px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 15px; outline: none; background: var(--card-bg); box-shadow: var(--shadow); }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    .btn { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
    .btn-secondary { background: #fff; color: var(--text-color); border: 1px solid var(--border-color); }
    .btn-danger { background: var(--danger); color: #fff; }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
    .section-title { font-size: 20px; color: #0f172a; margin: 0; }

    .channels-grid { display: grid; gap: 15px; grid-template-columns: repeat(2, 1fr); min-height: 80px; padding: 5px; }
    @media (min-width: 640px) { .channels-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
    .channels-grid.list-view { grid-template-columns: 1fr !important; }
    .channels-grid.list-view .channel-card { flex-direction: row; justify-content: space-between; height: 60px; padding: 0 20px; }

    .channel-card { background: var(--card-bg); border-radius: 14px; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; cursor: pointer; user-select: none; box-shadow: var(--shadow); border: 1px solid transparent; height: 120px; touch-action: manipulation; }
    .channel-card.admin-mode { cursor: grab; }
    .channel-card.admin-mode:active { cursor: grabbing; }
    
    .sortable-ghost { opacity: 0.3; background: #dbeafe !important; border: 2px dashed var(--primary) !important; }
    .sortable-drag { opacity: 0.9; transform: scale(1.05); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }

    .channel-name { font-weight: 700; font-size: 15px; color: var(--text-color); margin-top: 6px; pointer-events: none; }
    .channel-logo-img { width: 42px; height: 42px; object-fit: contain; border-radius: 50%; pointer-events: none; background: #ffffff; padding: 2px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); border: 1px solid var(--border-color); }
    .channel-icon-fallback { font-size: 32px; margin-bottom: 2px; pointer-events: none; }

    .channel-controls { position: absolute; top: 6px; left: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; }
    .channel-card:hover .channel-controls { opacity: 1; }
    .ctrl-btn { background: rgba(255, 255, 255, 0.9); border: 1px solid var(--border-color); width: 26px; height: 26px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .ctrl-btn.delete:hover { color: var(--danger); }
    .ctrl-btn.edit:hover { color: var(--primary); }

    .admin-only { display: none !important; }
    body.is-admin .admin-only { display: inline-flex !important; }
    body.is-admin div.admin-only { display: block !important; }

    footer { margin-top: 50px; text-align: center; padding: 20px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 14px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-card { background: #fff; padding: 25px; border-radius: 20px; width: 90%; max-width: 450px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 10px; outline: none; }
    .file-input-btn { display: inline-block; width: 100%; padding: 10px; text-align: center; background: #f8fafc; border: 1px dashed var(--border-color); border-radius: 10px; cursor: pointer; font-size: 13px; color: var(--text-muted); margin-top: 5px; }
    .file-input-btn:hover { background: #f1f5f9; border-color: var(--primary); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body class="">

  <div class="container">
    <header>
      <h1>📺 مشغل القنوات المباشرة</h1>
      <div class="header-actions">
        <!-- أزرار المشرف فقط -->
        <button class="btn admin-only" onclick="openAddModal()">➕ إضافة قناة</button>
        <button class="btn btn-secondary admin-only" onclick="copyCleanHtmlCode()" title="نسخ الكود كاملاً بنمط الزائر للاستبدال في GitHub">📋 نسخ كود HTML</button>
        <button class="btn btn-secondary admin-only" onclick="exportBackup()" title="تصدير القنوات المعدلة">💾 تصدير JSON</button>
        <label class="btn btn-secondary admin-only" style="cursor:pointer" title="استعادة قنوات ملف">
          📥 استعادة
          <input type="file" accept=".json" hidden="" onchange="importBackup(event)">
        </label>
        <button class="btn btn-secondary admin-only" onclick="openChangeCredentialsModal()">⚙️ إعدادات</button>
        <button class="btn btn-danger admin-only" onclick="logoutAdmin()">🚪 خروج</button>
        
        <button class="btn btn-secondary" onclick="toggleViewMode()" id="viewModeBtn">📱 قائمة</button>
      </div>
    </header>

    <div class="player-wrapper" id="playerWrapper" style="display: block;">
      <div class="player-header">
        <span class="player-title" id="currentChannelTitle">الحدث</span>
      </div>
      <div class="video-container" id="videoContainer"><iframe src="https://www.youtube.com/embed/au8t81S0tag?si=RSorNrXQCUkfyRni&amp;autoplay=1" allow="autoplay; encrypted-media" allowfullscreen=""></iframe></div>
    </div>

    <div class="controls-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="ابحث عن قناة..." id="searchInput" oninput="filterChannels()">
      </div>
    </div>

    <div class="section-header">
      <h2 class="section-title">📰 القنوات الإخبارية</h2>
    </div>
    <div class="channels-grid" id="newsGrid" data-category="news"><div class="channel-card admin-mode" data-id="1">
        
        <div class="channel-controls admin-only">
          <button class="ctrl-btn edit" onclick="openEditModal(event, '1')" title="تعديل">✏️</button>
          <button class="ctrl-btn delete" onclick="deleteChannel(event, '1')" title="حذف">🗑️</button>
        </div>

    let channels = [];
    let isListView = false;
    let isAdmin = false;
    let sortableNews, sortableDoc;

    let adminCreds = { user: 'Abokaled', pass: 'Zoom6410' };

    function init() {
      const savedCreds = localStorage.getItem('app_admin_creds');
      if (savedCreds) {
        try { adminCreds = JSON.parse(savedCreds); } catch(e){}
      }

      if (sessionStorage.getItem('is_admin_logged') === 'true') {
        isAdmin = true;
        document.body.classList.add('is-admin');
      }

      const saved = localStorage.getItem('app_channels_v5');
      if (saved) {
        try { channels = JSON.parse(saved); } catch(e) { channels = [...defaultData]; }
      } else {
        channels = [...defaultData];
      }
      render();
    }

    function saveState() {
      localStorage.setItem('app_channels_v5', JSON.stringify(channels));
    }

    /* 🧼 توليد كود نظيف تماماً بروابطك وقنواتك المحدثة بدون تسجيل دخول */
    function copyCleanHtmlCode() {
      // 1. أخذ نسخة من كود الصفحة
      let docClone = document.documentElement.cloneNode(true);

      // 2. تطهير الكود وإلغاء حالة Admin
      docClone.querySelector('body').classList.remove('is-admin');

      let fullHtml = "<!DOCTYPE html>\n" + docClone.outerHTML;
      const formattedJson = JSON.stringify(channels, null, 2);

      // 3. استبدال defaultData بالقنوات المحدثة
      fullHtml = fullHtml.replace(/const defaultData = \[[\s\S]*?\];/, `const defaultData = ${formattedJson};`);

      navigator.clipboard.writeText(fullHtml).then(() => {
        alert('📋 تم نسخ الكود بنجاح (بنظام الزائر)!\n\nاستبدله في GitHub وسيفتح للجميع وللتابلت بصفحة نظيفة ومحدثة دون تسجيل دخول.');
      }).catch(() => {
        alert('حدث خطأ أثناء النسخ التلقائي');
      });
    }

    function openLoginModal() {
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
      document.getElementById('loginModal').style.display = 'flex';
    }

    function closeLoginModal() {
      document.getElementById('loginModal').style.display = 'none';
    }

    function loginAdmin() {
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value.trim();

      if (u === adminCreds.user && p === adminCreds.pass) {
        isAdmin = true;
        sessionStorage.setItem('is_admin_logged', 'true');
        document.body.classList.add('is-admin');
        closeLoginModal();
        render();
        alert('✅ مرحباً أبا خالد، تم تسجيل الدخول كمشرف بنجاح.');
      } else {
        alert('❌ اسم المستخدم أو كلمة المرور غير صحيحة');
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      sessionStorage.removeItem('is_admin_logged');
      document.body.classList.remove('is-admin');
      render();
    }

    function openChangeCredentialsModal() {
      document.getElementById('newUser').value = adminCreds.user;
      document.getElementById('newPass').value = adminCreds.pass;
      document.getElementById('credModal').style.display = 'flex';
    }

    function closeCredModal() {
      document.getElementById('credModal').style.display = 'none';
    }

    function saveNewCredentials() {
      const u = document.getElementById('newUser').value.trim();
      const p = document.getElementById('newPass').value.trim();

      if (!u || !p) {
        alert('يرجى كتابة اسم المستخدم وكلمة المرور');
        return;
      }

      adminCreds = { user: u, pass: p };
      localStorage.setItem('app_admin_creds', JSON.stringify(adminCreds));
      closeCredModal();
      alert('✅ تم تحديث بيانات المشرف بنجاح!');
    }

    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(channels, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "my_channels_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importBackup(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          try {
            const importedData = JSON.parse(evt.target.result);
            if (Array.isArray(importedData)) {
              channels = importedData;
              saveState();
              render();
              alert('✅ تم استعادة القنوات بنجاح!');
            }
          } catch(err) {
            alert('⚠️ ملف النسخة الاحتياطية غير صالح');
          }
        };
        reader.readAsText(file);
      }
    }

    function render() {
      const newsGrid = document.getElementById('newsGrid');
      const docGrid = document.getElementById('docGrid');
      newsGrid.innerHTML = '';
      docGrid.innerHTML = '';

      channels.forEach((c) => {
        const card = createChannelCard(c);
        if (c.category === 'news') {
          newsGrid.appendChild(card);
        } else {
          docGrid.appendChild(card);
        }
      });

      initSortable();
    }

    function createChannelCard(c) {
      const card = document.createElement('div');
      card.className = 'channel-card' + (isAdmin ? ' admin-mode' : '');
      card.dataset.id = c.id;

      const logoHtml = c.logo 
        ? `<img src="${c.logo}" class="channel-logo-img" alt="${escapeHtml(c.name)}" onerror="this.outerHTML='<span class=\\'channel-icon-fallback\\'>📺</span>'">`
        : `<span class="channel-icon-fallback">📺</span>`;

      const controlsHtml = isAdmin ? `
        <div class="channel-controls admin-only">
          <button class="ctrl-btn edit" onclick="openEditModal(event, '${c.id}')" title="تعديل">✏️</button>
          <button class="ctrl-btn delete" onclick="deleteChannel(event, '${c.id}')" title="حذف">🗑️</button>
        </div>` : '';

      card.innerHTML = `
        ${controlsHtml}
        ${logoHtml}
        <div class="channel-name">${escapeHtml(c.name)}</div>
      `;

      card.onclick = (e) => {
        if (e.target.closest('.channel-controls')) return;
        playChannel(c.url, c.name);
      };

      return card;
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById('chanLogoBase64').value = evt.target.result;
          document.getElementById('chanLogoUrl').value = '';
        };
        reader.readAsDataURL(file);
      }
    }

    function initSortable() {
      if (sortableNews) sortableNews.destroy();
      if (sortableDoc) sortableDoc.destroy();

      if (isAdmin) {
        const options = {
          group: 'sharedChannels',
          animation: 200,
          delay: 150,
          delayOnTouchOnly: true,
          touchStartThreshold: 5,
          onEnd: saveNewOrder
        };

        sortableNews = new Sortable(document.getElementById('newsGrid'), options);
        sortableDoc = new Sortable(document.getElementById('docGrid'), options);
      }
    }

    function saveNewOrder() {
      const newChannels = [];
      document.querySelectorAll('.channels-grid').forEach(grid => {
        const category = grid.dataset.category;
        grid.querySelectorAll('.channel-card').forEach(card => {
          const id = card.dataset.id;
          const found = channels.find(c => c.id === id);
          if (found) {
            found.category = category;
            newChannels.push(found);
          }
        });
      });
      channels = newChannels;
      saveState();
    }

    function playChannel(url, name) {
      const wrapper = document.getElementById('playerWrapper');
      const container = document.getElementById('videoContainer');
      const title = document.getElementById('currentChannelTitle');

      let playUrl = url;
      if (playUrl.includes('?')) {
        playUrl += '&autoplay=1';
      } else {
        playUrl += '?autoplay=1';
      }

      title.textContent = name;
      container.innerHTML = `<iframe src="${playUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      wrapper.style.display = 'block';
      wrapper.scrollIntoView({ behavior: 'smooth' });
    }

    function toggleViewMode() {
      isListView = !isListView;
      document.querySelectorAll('.channels-grid').forEach(g => g.classList.toggle('list-view', isListView));
      document.getElementById('viewModeBtn').textContent = isListView ? '🎴 عرض شبكي' : '📱 عرض قائمة';
    }

    function filterChannels() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.channel-card').forEach(card => {
        const name = card.querySelector('.channel-name').textContent.toLowerCase();
        card.style.display = name.includes(query) ? 'flex' : 'none';
      });
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'إضافة قناة جديدة';
      document.getElementById('editChannelId').value = '';
      document.getElementById('chanName').value = '';
      document.getElementById('chanUrl').value = '';
      document.getElementById('chanLogoUrl').value = '';
      document.getElementById('chanLogoBase64').value = '';
      document.getElementById('logoFileInput').value = '';
      document.getElementById('channelModal').style.display = 'flex';
    }

    function openEditModal(e, id) {
      e.stopPropagation();
      const c = channels.find(x => x.id === id);
      if (!c) return;

      document.getElementById('modalTitle').textContent = 'تعديل البيانات';
      document.getElementById('editChannelId').value = c.id;
      document.getElementById('chanName').value = c.name;
      document.getElementById('chanUrl').value = c.url;
      document.getElementById('chanLogoUrl').value = c.logo && !c.logo.startsWith('data:') ? c.logo : '';
      document.getElementById('chanLogoBase64').value = c.logo && c.logo.startsWith('data:') ? c.logo : '';
      document.getElementById('chanCategory').value = c.category;
      document.getElementById('channelModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('channelModal').style.display = 'none';
    }

    function saveChannel() {
      const id = document.getElementById('editChannelId').value;
      const name = document.getElementById('chanName').value.trim();
      const url = document.getElementById('chanUrl').value.trim();
      const logoUrl = document.getElementById('chanLogoUrl').value.trim();
      const logoBase64 = document.getElementById('chanLogoBase64').value;
      const category = document.getElementById('chanCategory').value;

      if (!name || !url) {
        alert('يرجى ملء كافة الحقول');
        return;
      }

      const finalLogo = logoBase64 || logoUrl;

      if (id) {
        const c = channels.find(x => x.id === id);
        if (c) {
          c.name = name;
          c.url = url;
          if (finalLogo) c.logo = finalLogo;
          c.category = category;
        }
      } else {
        channels.unshift({
          id: Date.now().toString(),
          name,
          url,
          logo: finalLogo,
          category
        });
      }

      saveState();
      render();
      closeModal();
    }

    function deleteChannel(e, id) {
      e.stopPropagation();
      if (confirm('هل أنت متأكد من حذف هذه القناة؟')) {
        channels = channels.filter(c => c.id !== id);
        saveState();
        render();
      }
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    init();
  </script>
