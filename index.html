<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مشغل القنوات المباشرة التفاعلي</title>
  
  <!-- مكتبة SortableJS لضمان سلاسة السحب باللمس والماوس -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --bg-color: #f4f7fe;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger: #ef4444;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 15px 60px;
    }

    /* 🟢 الترويسة */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
      background: var(--card-bg);
      padding: 20px 25px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* 📺 المشغل */
    .player-wrapper {
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
      margin-bottom: 30px;
      display: none;
    }

    .player-header {
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-title {
      font-weight: bold;
      font-size: 16px;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 🔍 البحث */
    .controls-bar {
      margin-bottom: 30px;
    }

    .search-box {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 20px;
      padding-right: 45px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: var(--card-bg);
      box-shadow: var(--shadow);
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .search-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-secondary {
      background: #fff;
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    /* 📂 الأقسام والقنوات */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 30px 0 15px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    .section-title {
      font-size: 20px;
      color: #0f172a;
      margin: 0;
    }

    /* 🎴 الشبكة المرنة (Grid) */
    .channels-grid {
      display: grid;
      gap: 15px;
      grid-template-columns: repeat(2, 1fr);
      min-height: 80px;
      padding: 5px;
    }

    @media (min-width: 640px) {
      .channels-grid {
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      }
    }

    .channels-grid.list-view {
      grid-template-columns: 1fr !important;
    }

    .channels-grid.list-view .channel-card {
      flex-direction: row;
      justify-content: space-between;
      height: 60px;
      padding: 0 20px;
    }

    /* 🎴 بطاقة القناة */
    .channel-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      cursor: grab;
      user-select: none;
      box-shadow: var(--shadow);
      border: 1px solid transparent;
      height: 120px;
      touch-action: manipulation;
    }

    .channel-card:active {
      cursor: grabbing;
    }

    .sortable-ghost {
      opacity: 0.3;
      background: #dbeafe !important;
      border: 2px dashed var(--primary) !important;
    }

    .sortable-drag {
      opacity: 0.9;
      transform: scale(1.05);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
    }

    .channel-name {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-color);
      margin-top: 6px;
      pointer-events: none;
    }

    /* 🖼️ شعار القناة التلقائي */
    .channel-logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 8px;
      pointer-events: none;
      background: #f8fafc;
      padding: 2px;
      border: 1px solid var(--border-color);
    }

    .channel-icon-fallback {
      font-size: 28px;
      margin-bottom: 2px;
      pointer-events: none;
    }

    .channel-controls {
      position: absolute;
      top: 6px;
      left: 6px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .channel-card:hover .channel-controls {
      opacity: 1;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border-color);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .ctrl-btn.delete:hover { color: var(--danger); }
    .ctrl-btn.edit:hover { color: var(--primary); }

    /* 🪟 النافذة المنبثقة */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: #fff;
      padding: 25px;
      border-radius: 20px;
      width: 90%;
      max-width: 450px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <header>
      <h1>📺 مشغل القنوات المباشرة</h1>
      <div class="header-actions">
        <button class="btn" onclick="openAddModal()">➕ إضافة قناة</button>
        <button class="btn btn-secondary" onclick="toggleViewMode()" id="viewModeBtn">📱 عرض قائمة</button>
      </div>
    </header>

    <!-- المشغل -->
    <div class="player-wrapper" id="playerWrapper">
      <div class="player-header">
        <span class="player-title" id="currentChannelTitle">القناة</span>
      </div>
      <div class="video-container" id="videoContainer"></div>
    </div>

    <!-- البحث -->
    <div class="controls-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="ابحث عن قناة..." id="searchInput" oninput="filterChannels()">
      </div>
    </div>

    <!-- الأخبار -->
    <div class="section-header">
      <h2 class="section-title">📰 القنوات الإخبارية</h2>
    </div>
    <div class="channels-grid" id="newsGrid" data-category="news"></div>

    <!-- الوثائقيات -->
    <div class="section-header">
      <h2 class="section-title">🧭 القنوات الوثائقية</h2>
    </div>
    <div class="channels-grid" id="docGrid" data-category="doc"></div>

  </div>

  <!-- مودال الإضافة والتعديل -->
  <div class="modal-overlay" id="channelModal">
    <div class="modal-card">
      <h3 id="modalTitle">إضافة قناة جديدة</h3>
      <input type="hidden" id="editChannelId">
      
      <div class="form-group">
        <label>اسم القناة</label>
        <input type="text" id="chanName" class="form-control" placeholder="مثال: قناة الجزيرة">
      </div>

      <div class="form-group">
        <label>رابط التضمين (Embed URL)</label>
        <input type="text" id="chanUrl" class="form-control" placeholder="https://www.youtube.com/embed/...">
      </div>

      <div class="form-group">
        <label>القسم</label>
        <select id="chanCategory" class="form-control">
          <option value="news">الإخبارية</option>
          <option value="doc">الوثائقية</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
        <button class="btn" onclick="saveChannel()">حفظ</button>
      </div>
    </div>
  </div>

  <script>
    const defaultData = [
      { id: '1', name: 'الجزيرة', url: 'https://www.youtube.com/embed/bNyUyrR0PHo', category: 'news' },
      { id: '2', name: 'العربية', url: 'https://www.youtube.com/embed/n7eQejkXbnM', category: 'news' },
      { id: '3', name: 'بي بي سي عربي', url: 'https://www.youtube.com/embed/Q_OoLm57loM', category: 'news' },
      { id: '4', name: 'سكاي نيوز', url: 'https://www.youtube.com/embed/oY976rzO-EI', category: 'news' },
      { id: '5', name: 'فرانس 24', url: 'https://www.youtube.com/embed/VuYzy8IuT0Y', category: 'news' },
      { id: '6', name: 'DW عربية', url: 'https://www.youtube.com/embed/AGkp2AL8e7o', category: 'news' },
      { id: '7', name: 'الحدث', url: 'https://www.youtube.com/embed/zq6ohxTDNZY', category: 'news' },
      { id: '8', name: 'الشرق', url: 'https://www.youtube.com/embed/f6VpkfV7m4Y', category: 'news' },
      { id: '9', name: 'ناشيونال جيوغرافيك', url: 'https://www.youtube.com/embed/daqB3i9WYIY', category: 'doc' },
      { id: '10', name: 'الوثائقية الجزيرة', url: 'https://www.youtube.com/embed/TiPYdMXt_XI', category: 'doc' },
      { id: '11', name: 'الشرق وثائقية', url: 'https://www.youtube.com/embed/FlzMedKfQOs', category: 'doc' }
    ];

    let channels = [];
    let isListView = false;
    let sortableNews, sortableDoc;

    // 🌐 دالة استخراج الشعار تلقائياً من النطاق (Domain)
    function getFaviconUrl(url) {
      try {
        const parsedUrl = new URL(url);
        return `https://www.google.com/s2/favicons?domain=${parsedUrl.hostname}&sz=64`;
      } catch (e) {
        return null;
      }
    }

    function init() {
      const saved = localStorage.getItem('app_channels_v3');
      if (saved) {
        try { channels = JSON.parse(saved); } catch(e) { channels = [...defaultData]; }
      } else {
        channels = [...defaultData];
      }
      render();
    }

    function saveState() {
      localStorage.setItem('app_channels_v3', JSON.stringify(channels));
    }

    function render() {
      const newsGrid = document.getElementById('newsGrid');
      const docGrid = document.getElementById('docGrid');

      newsGrid.innerHTML = '';
      docGrid.innerHTML = '';

      channels.forEach((c) => {
        const card = createChannelCard(c);
        if (c.category === 'news') {
          newsGrid.appendChild(card);
        } else {
          docGrid.appendChild(card);
        }
      });

      initSortable();
    }

    function createChannelCard(c) {
      const card = document.createElement('div');
      card.className = 'channel-card';
      card.dataset.id = c.id;

      const logoUrl = getFaviconUrl(c.url);
      const logoHtml = logoUrl 
        ? `<img src="${logoUrl}" class="channel-logo-img" alt="${escapeHtml(c.name)}" onerror="this.outerHTML='<span class=\\'channel-icon-fallback\\'>📺</span>'">`
        : `<span class="channel-icon-fallback">📺</span>`;

      card.innerHTML = `
        <div class="channel-controls">
          <button class="ctrl-btn edit" onclick="openEditModal(event, '${c.id}')" title="تعديل">✏️</button>
          <button class="ctrl-btn delete" onclick="deleteChannel(event, '${c.id}')" title="حذف">🗑️</button>
        </div>
        ${logoHtml}
        <div class="channel-name">${escapeHtml(c.name)}</div>
      `;

      card.onclick = (e) => {
        if (e.target.closest('.channel-controls')) return;
        playChannel(c.url, c.name);
      };

      return card;
    }

    function initSortable() {
      if (sortableNews) sortableNews.destroy();
      if (sortableDoc) sortableDoc.destroy();

      const options = {
        group: 'sharedChannels',
        animation: 200,
        delay: 150,
        delayOnTouchOnly: true,
        touchStartThreshold: 5,
        onEnd: saveNewOrder
      };

      sortableNews = new Sortable(document.getElementById('newsGrid'), options);
      sortableDoc = new Sortable(document.getElementById('docGrid'), options);
    }

    function saveNewOrder() {
      const newChannels = [];
      document.querySelectorAll('.channels-grid').forEach(grid => {
        const category = grid.dataset.category;
        grid.querySelectorAll('.channel-card').forEach(card => {
          const id = card.dataset.id;
          const found = channels.find(c => c.id === id);
          if (found) {
            found.category = category;
            newChannels.push(found);
          }
        });
      });
      channels = newChannels;
      saveState();
    }

    function playChannel(url, name) {
      const wrapper = document.getElementById('playerWrapper');
      const container = document.getElementById('videoContainer');
      const title = document.getElementById('currentChannelTitle');

      let playUrl = url;
      if (playUrl.includes('?')) {
        playUrl += '&autoplay=1';
      } else {
        playUrl += '?autoplay=1';
      }

      title.textContent = name;
      container.innerHTML = `<iframe src="${playUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      wrapper.style.display = 'block';
      wrapper.scrollIntoView({ behavior: 'smooth' });
    }

    function toggleViewMode() {
      isListView = !isListView;
      document.querySelectorAll('.channels-grid').forEach(g => g.classList.toggle('list-view', isListView));
      document.getElementById('viewModeBtn').textContent = isListView ? '🎴 عرض شبكي' : '📱 عرض قائمة';
    }

    function filterChannels() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.channel-card').forEach(card => {
        const name = card.querySelector('.channel-name').textContent.toLowerCase();
        card.style.display = name.includes(query) ? 'flex' : 'none';
      });
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'إضافة قناة جديدة';
      document.getElementById('editChannelId').value = '';
      document.getElementById('chanName').value = '';
      document.getElementById('chanUrl').value = '';
      document.getElementById('channelModal').style.display = 'flex';
    }

    function openEditModal(e, id) {
      e.stopPropagation();
      const c = channels.find(x => x.id === id);
      if (!c) return;

      document.getElementById('modalTitle').textContent = 'تعديل البيانات';
      document.getElementById('editChannelId').value = c.id;
      document.getElementById('chanName').value = c.name;
      document.getElementById('chanUrl').value = c.url;
      document.getElementById('chanCategory').value = c.category;
      document.getElementById('channelModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('channelModal').style.display = 'none';
    }

    function saveChannel() {
      const id = document.getElementById('editChannelId').value;
      const name = document.getElementById('chanName').value.trim();
      const url = document.getElementById('chanUrl').value.trim();
      const category = document.getElementById('chanCategory').value;

      if (!name || !url) {
        alert('يرجى ملء كافة الحقول');
        return;
      }

      if (id) {
        const c = channels.find(x => x.id === id);
        if (c) {
          c.name = name;
          c.url = url;
          c.category = category;
        }
      } else {
        channels.unshift({
          id: Date.now().toString(),
          name,
          url,
          category
        });
      }

      saveState();
      render();
      closeModal();
    }

    function deleteChannel(e, id) {
      e.stopPropagation();
      if (confirm('هل أنت متأكد من حذف هذه القناة؟')) {
        channels = channels.filter(c => c.id !== id);
        saveState();
        render();
      }
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    init();
  </script>
</body>
</html>
